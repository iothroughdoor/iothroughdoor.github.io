<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">

        <title>Going in through the out door</title>
        <link rel="stylesheet" href="site.css">
        <script src="js/jquery-4.0.0.min.js"></script>
        <script type="text/javascript">
            const params = new URLSearchParams(window.location.search);
            var current_page = params.get("current_page");
            if (current_page == null) {
                current_page = "articles";
            }
            const titles = []
            titles["articles"] = "Articles";
            titles["about"] = "About";
        </script>
    </head>
    <body>
        <div class="parent" id="line1">
            <div class="left">
            </div>
            <div class="right">
                <nav>
                    <ul>
                        <li> <a href="?current_page=articles" id="articles">Articles</a> </li>
                        <li> <a href="?current_page=about" id="about">About</a> </li>
                    </ul>
                </nav>
            </div>
            <div class="column-three">
            </div>
        </div>
        <div class="parent" id="line2"> 
            <div class="left"></div>
            <div class="right" id="title">
            </div>
            <div class="column-three">
            </div>
        </div>
        <div class="parent" id="line3">
            <div class="left" id="author">
                <span id="author-name">Philipp Nöldner</span><br/>
                Theorist and Craftsman<br/>
                Nuremberg, Germany<br/>
            </div>
            <div class="right" id="content">
            </div>
            <div class="column-three">
            </div>
        </div>

        <script type="text/javascript">
            if (current_page.startsWith("articles/")) {
                document.getElementById("title").innerHTML = "<h1>" + titles["articles"] + "</h1>";
            } else {
                document.getElementById("title").innerHTML = "<h1>" + titles[current_page] + "</h1>";
            }
            $("#content").load(current_page + ".html");
            $("#content").load(current_page + ".html");
        </script>
    </body>
</html>
